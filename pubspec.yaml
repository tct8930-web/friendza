name: friendza_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using flutter pub publish. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish the package privately.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder may be overridden by specifying --build-name and --build-number, respectively.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The following adds the Flutter lints package.
  # The package is activated in the analysis_options.yaml file.
  flutter_lints: ^6.0.0

# For information on the Dart language, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Include the Material Icons font.
  uses-material-design: true

  # To add assets to your application, add an assets section here.
  # Example:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_burr.png

  # To add custom fonts, add a fonts section here.